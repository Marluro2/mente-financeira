<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Lâmpada LED: mais luz gastando menos energia -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BF0B0"/>
      <stop offset="1" stop-color="#12805C"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="168" cy="32" r="50" fill="#FFFFFF" opacity="0.13"/>
  <circle cx="26" cy="178" r="40" fill="#FFFFFF" opacity="0.09"/>

  <!-- raios de luz -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <path d="M100 14 v12 M38 40 l9 8 M162 40 l-9 8 M20 92 h12 M168 92 h12"/>
  </g>
  <!-- bulbo -->
  <path d="M76 126 C60 112 52 98 52 82 A48 48 0 0 1 148 82 C148 98 140 112 124 126 L122 138 H78 Z" fill="#FFFBE0" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/>
  <path d="M70 66 A34 34 0 0 1 90 46" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- raio de energia -->
  <path d="M108 52 L82 92 H98 L90 124 L120 80 H104 Z" fill="#FFD23F" stroke="#F28C00" stroke-width="4" stroke-linejoin="round"/>
  <!-- rosca -->
  <rect x="76" y="138" width="48" height="26" rx="5" fill="#9AA1AC" stroke="#2B2D42" stroke-width="4"/>
  <path d="M78 147 H122 M78 155 H122" stroke="#6B7280" stroke-width="3"/>
  <path d="M86 164 H114 L108 176 H92 Z" fill="#2B2D42" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>
  <!-- moeda economizada -->
  <circle cx="158" cy="150" r="20" fill="#FFD23F" stroke="#D99400" stroke-width="4"/>
  <circle cx="158" cy="150" r="9" fill="none" stroke="#D99400" stroke-width="3"/>
  <!-- brilhos -->
  <path d="M42 141 v14 M35 148 h14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
