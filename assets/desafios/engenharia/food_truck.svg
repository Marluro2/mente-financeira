<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Food truck -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC45C"/>
      <stop offset="1" stop-color="#E4336F"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="168" cy="32" r="50" fill="#FFFFFF" opacity="0.13"/>
  <circle cx="26" cy="178" r="40" fill="#FFFFFF" opacity="0.09"/>

  <!-- chão -->
  <path d="M10 172 H190" stroke="#2B2D42" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <!-- placa no teto: hambúrguer -->
  <rect x="62" y="50" width="6" height="14" fill="#2B2D42"/>
  <rect x="96" y="50" width="6" height="14" fill="#2B2D42"/>
  <path d="M58 40 C58 24 106 24 106 40 Z" fill="#F2A541" stroke="#2B2D42" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="56" y="40" width="52" height="6" rx="3" fill="#2EE59D" stroke="#2B2D42" stroke-width="3"/>
  <rect x="58" y="46" width="48" height="7" rx="3" fill="#8A3B12" stroke="#2B2D42" stroke-width="3"/>
  <path d="M60 53 H104 C104 60 60 60 60 53 Z" fill="#F2A541" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>
