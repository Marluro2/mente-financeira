  <g fill="#2B2D42"><circle cx="56" cy="158" r="17"/><circle cx="150" cy="158" r="17"/></g>
  <g fill="#C9CED6"><circle cx="56" cy="158" r="7"/><circle cx="150" cy="158" r="7"/></g>
