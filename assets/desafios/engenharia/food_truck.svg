  <!-- janela de atendimento -->
  <rect x="36" y="82" width="78" height="38" rx="3" fill="#2B2D42"/>
  <circle cx="58" cy="106" r="8" fill="#FFD23F"/>
  <rect x="78" y="96" width="22" height="24" rx="3" fill="#FF7A1A"/>
  <path d="M30 120 H120" stroke="#9AA1AC" stroke-width="7" stroke-linecap="round"/>
  <!-- toldo listrado -->
  <path d="M30 70 H120 V78 a7.5 7.5 0 0 1 -15 0 a7.5 7.5 0 0 1 -15 0 a7.5 7.5 0 0 1 -15 0 a7.5 7.5 0 0 1 -15 0 a7.5 7.5 0 0 1 -15 0 a7.5 7.5 0 0 1 -15 0 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
  <path d="M30 70 H45 V78 a7.5 7.5 0 0 1 -15 0 Z M60 70 H75 V78 a7.5 7.5 0 0 1 -15 0 Z M90 70 H105 V78 a7.5 7.5 0 0 1 -15 0 Z" fill="#E4336F"/>
  <path d="M30 70 H120 V78 a7.5 7.5 0 0 1 -15 0 a7.5 7.5 0 0 1 -15 0 a7.5 7.5 0 0 1 -15 0 a7.5 7.5 0 0 1 -15 0 a7.5 7.5 0 0 1 -15 0 a7.5 7.5 0 0 1 -15 0 Z" fill="none" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
