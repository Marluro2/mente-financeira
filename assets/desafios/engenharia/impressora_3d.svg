<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Impressora 3D imprimindo uma peça -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C79BFF"/>
      <stop offset="1" stop-color="#6C3CE1"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="168" cy="32" r="50" fill="#FFFFFF" opacity="0.13"/>
  <circle cx="26" cy="178" r="40" fill="#FFFFFF" opacity="0.09"/>

  <!-- estrutura -->
  <rect x="34" y="40" width="132" height="140" rx="12" fill="#2B2D42"/>
  <rect x="46" y="52" width="108" height="98" rx="6" fill="#EDE7FF"/>
  <path d="M60 52 V140 M140 52 V140" stroke="#C9CED6" stroke-width="5"/>
  <!-- carretel de filamento -->
  <rect x="146" y="22" width="6" height="22" fill="#2B2D42"/>
  <circle cx="149" cy="24" r="17" fill="#2EE59D" stroke="#2B2D42" stroke-width="4"/>
  <circle cx="149" cy="24" r="10" fill="none" stroke="#12B886" stroke-width="3"/>
  <circle cx="149" cy="24" r="4" fill="#2B2D42"/>
  <path d="M134 30 C116 34 104 46 100 68" fill="none" stroke="#2EE59D" stroke-width="3.5" stroke-linecap="round"/>
  <!-- trilho e cabeçote -->
  <rect x="46" y="76" width="108" height="8" fill="#9AA1AC"/>
  <rect x="86" y="68" width="28" height="26" rx="5" fill="#FF7A1A" stroke="#2B2D42" stroke-width="4"/>
  <path d="M94 94 h12 l-6 10 z" fill="#2B2D42" stroke="#2B2D42" stroke-width="2" stroke-linejoin="round"/>
  <!-- peça sendo impressa -->
  <path d="M76 140 C72 128 80 120 84 108 H116 C120 120 128 128 124 140 Z" fill="#2EE59D" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
  <path d="M80 118 H120 M76 128 H124" stroke="#12B886" stroke-width="3"/>
  <path d="M86 108 H100" stroke="#FFB547" stroke-width="4" stroke-linecap="round"/>
  <!-- mesa -->
  <rect x="58" y="140" width="84" height="8" rx="2" fill="#9AA1AC" stroke="#2B2D42" stroke-width="3"/>
  <!-- painel -->
  <rect x="62" y="158" width="40" height="12" rx="3" fill="#5CC8FF"/>
  <circle cx="128" cy="164" r="6" fill="#FFD23F"/>
  <!-- brilhos -->
  <path d="M56 17 v10 M51 22 h10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M20 99 v10 M15 104 h10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
