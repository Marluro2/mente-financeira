<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Máquina industrial (prensa/CNC) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AA3C7"/>
      <stop offset="1" stop-color="#3F4460"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="168" cy="32" r="50" fill="#FFFFFF" opacity="0.13"/>
  <circle cx="26" cy="178" r="40" fill="#FFFFFF" opacity="0.09"/>

  <!-- base -->
  <rect x="18" y="160" width="132" height="16" rx="5" fill="#2B2D42"/>
  <!-- corpo da máquina -->
  <rect x="40" y="40" width="88" height="20" rx="5" fill="#F2A900" stroke="#2B2D42" stroke-width="4"/>
  <rect x="26" y="56" width="116" height="106" rx="10" fill="#FFD23F" stroke="#2B2D42" stroke-width="5"/>
  <!-- janela com a ferramenta -->
  <rect x="38" y="68" width="74" height="60" rx="6" fill="#BFE9FF" stroke="#2B2D42" stroke-width="4"/>
  <rect x="68" y="68" width="14" height="24" fill="#9AA1AC" stroke="#2B2D42" stroke-width="3.5"/>
  <path d="M70 92 h10 l-5 12 z" fill="#2B2D42" stroke="#2B2D42" stroke-width="2" stroke-linejoin="round"/>
  <rect x="52" y="110" width="46" height="12" rx="2" fill="#FF7A1A" stroke="#2B2D42" stroke-width="3.5"/>
  <path d="M62 102 l-6 -4 M88 102 l6 -4 M64 108 l-8 0 M86 108 l8 0" stroke="#FF7A1A" stroke-width="3" stroke-linecap="round"/>
  <!-- painel -->
  <rect x="118" y="68" width="16" height="60" rx="4" fill="#2B2D42"/>
  <circle cx="126" cy="80" r="4.5" fill="#FF5C5C"/>
  <circle cx="126" cy="94" r="4.5" fill="#2EE59D"/>
  <rect x="121" y="104" width="10" height="16" rx="2" fill="#5CC8FF"/>
  <!-- faixa de segurança -->
  <rect x="38" y="138" width="96" height="14" rx="3" fill="#2B2D42"/>
  <path d="M44 152 l10 -14 h10 l-10 14 z M68 152 l10 -14 h10 l-10 14 z M92 152 l10 -14 h10 l-10 14 z M116 152 l10 -14 h8 v2 l-8 12 z" fill="#FFD23F"/>
  <!-- engrenagem grande -->
  <g transform="translate(158 66)">
    <g fill="#2B2D42">
      <rect x="-7" y="-28" width="14" height="56" rx="3"/>
      <rect x="-7" y="-28" width="14" height="56" rx="3" transform="rotate(45)"/>
      <rect x="-7" y="-28" width="14" height="56" rx="3" transform="rotate(90)"/>
      <rect x="-7" y="-28" width="14" height="56" rx="3" transform="rotate(135)"/>
      <circle r="22.5"/>
    </g>
    <g fill="#C9CED6">
      <rect x="-4.5" y="-25.5" width="9" height="51" rx="2"/>
      <rect x="-4.5" y="-25.5" width="9" height="51" rx="2" transform="rotate(45)"/>
      <rect x="-4.5" y="-25.5" width="9" height="51" rx="2" transform="rotate(90)"/>
      <rect x="-4.5" y="-25.5" width="9" height="51" rx="2" transform="rotate(135)"/>
      <circle r="20"/>
    </g>
    <circle r="8" fill="#6B7280" stroke="#2B2D42" stroke-width="4"/>
  </g>
  <!-- engrenagem pequena -->
  <g transform="translate(166 112) rotate(22)">
    <g fill="#2B2D42">
      <rect x="-5" y="-17" width="10" height="34" rx="2"/>
      <rect x="-5" y="-17" width="10" height="34" rx="2" transform="rotate(60)"/>
      <rect x="-5" y="-17" width="10" height="34" rx="2" transform="rotate(120)"/>
      <circle r="13.5"/>
    </g>
    <g fill="#FF7A1A">
      <rect x="-2.5" y="-14.5" width="5" height="29" rx="1"/>
      <rect x="-2.5" y="-14.5" width="5" height="29" rx="1" transform="rotate(60)"/>
      <rect x="-2.5" y="-14.5" width="5" height="29" rx="1" transform="rotate(120)"/>
      <circle r="11"/>
    </g>
    <circle r="4" fill="#2B2D42"/>
  </g>
  <!-- brilhos -->
  <path d="M176 143 v14 M169 150 h14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M22 29 v10 M17 34 h10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
