<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BF0B0"/>
      <stop offset="1" stop-color="#1FA45C"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9794A"/>
      <stop offset="1" stop-color="#B8502B"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="170" cy="170" r="50" fill="#FFFFFF" opacity="0.12"/>
  <!-- caule -->
  <path d="M100 150 C98 120 112 104 104 80 C98 62 104 46 116 36" fill="none" stroke="#11703E" stroke-width="7" stroke-linecap="round"/>
  <!-- folhas -->
  <path d="M102 118 C80 118 66 104 64 92 C82 90 98 100 102 118 Z" fill="#2DC26B"/>
  <path d="M106 98 C126 100 140 88 144 74 C126 72 110 82 106 98 Z" fill="#2DC26B"/>
  <path d="M104 72 C90 68 82 56 82 46 C96 46 104 58 104 72 Z" fill="#43D17F"/>
  <!-- moedas crescendo -->
  <g stroke="#D99400" stroke-width="3.5">
    <circle cx="70" cy="126" r="9" fill="#FFD23F"/>
    <circle cx="148" cy="100" r="12" fill="#FFD23F"/>
    <circle cx="68" cy="66" r="15" fill="#FFD23F"/>
    <circle cx="136" cy="44" r="19" fill="#FFD23F"/>
  </g>
  <g fill="none" stroke="#D99400" stroke-width="2.5">
    <circle cx="68" cy="66" r="7"/>
    <circle cx="136" cy="44" r="9"/>
  </g>
  <!-- vaso -->
  <path d="M68 148 h64 l-8 38 h-48 z" fill="url(#pot)"/>
  <rect x="62" y="140" width="76" height="14" rx="5" fill="#F08A5D"/>
  <!-- brilhos -->
  <path d="M168 60 v14 M161 67 h14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M36 44 v10 M31 49 h10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
