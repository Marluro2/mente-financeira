<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Custos fixos e variáveis: o galpão não muda, as caixas crescem -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6F36B"/>
      <stop offset="1" stop-color="#3E9A1E"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="30" cy="30" r="44" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="176" cy="178" r="36" fill="#FFFFFF" opacity="0.09"/>
  <!-- galpão (custo fixo) -->
  <rect x="22" y="96" width="76" height="74" fill="#F4F1EA" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
  <path d="M14 100 L60 58 L106 100 Z" fill="#D62839" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="60" cy="84" r="7" fill="#5CC8FF" stroke="#2B2D42" stroke-width="3"/>
  <rect x="40" y="120" width="40" height="50" fill="#9AA1AC" stroke="#2B2D42" stroke-width="4"/>
  <path d="M42 132 H78 M42 144 H78 M42 156 H78" stroke="#6B7280" stroke-width="3"/>
  <!-- caixas (custo variável) -->
  <g fill="#E0A86A" stroke="#2B2D42" stroke-width="3.5" stroke-linejoin="round">
    <rect x="110" y="148" width="22" height="22" rx="2"/>
    <rect x="136" y="148" width="22" height="22" rx="2"/>
    <rect x="136" y="124" width="22" height="22" rx="2"/>
    <rect x="162" y="148" width="22" height="22" rx="2"/>
    <rect x="162" y="124" width="22" height="22" rx="2"/>
    <rect x="162" y="100" width="22" height="22" rx="2"/>
  </g>
  <path d="M121 150 v7 M147 150 v7 M147 126 v7 M173 150 v7 M173 126 v7 M173 102 v7" stroke="#F4D6A0" stroke-width="4"/>
  <!-- seta de crescimento -->
  <path d="M114 134 L144 106" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M134 98 L156 94 L150 116 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <!-- chão -->
  <path d="M10 171 H190" stroke="#2B2D42" stroke-width="5" stroke-linecap="round"/>
  <!-- moeda -->
  <circle cx="158" cy="52" r="20" fill="#FFD23F" stroke="#D99400" stroke-width="4"/>
  <circle cx="158" cy="52" r="9" fill="none" stroke="#D99400" stroke-width="3"/>
  <!-- brilhos -->
  <path d="M112 30 v14 M105 37 h14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M30 34 v10 M25 39 h10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
