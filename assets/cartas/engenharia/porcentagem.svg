<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Porcentagem: etiqueta de preço com o símbolo de % -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB3C7"/>
      <stop offset="1" stop-color="#E0245E"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="170" cy="32" r="46" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="28" cy="178" r="38" fill="#FFFFFF" opacity="0.09"/>
  <!-- etiqueta -->
  <g transform="rotate(-18 100 104)">
    <path d="M40 62 H134 L170 104 L134 146 H40 a10 10 0 0 1 -10 -10 V72 a10 10 0 0 1 10 -10 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="140" cy="104" r="8" fill="#FFB3C7" stroke="#2B2D42" stroke-width="4"/>
    <!-- símbolo % -->
    <circle cx="64" cy="86" r="12" fill="none" stroke="#E0245E" stroke-width="7"/>
    <circle cx="102" cy="122" r="12" fill="none" stroke="#E0245E" stroke-width="7"/>
    <path d="M106 78 L60 130" stroke="#E0245E" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- barbante -->
  <path d="M152 76 C168 58 176 44 170 26" fill="none" stroke="#2B2D42" stroke-width="3.5" stroke-linecap="round"/>
  <!-- setas de aumento e desconto -->
  <path d="M34 40 V20 M26 28 L34 18 L42 28" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 18 V38 M52 30 L60 40 L68 30" fill="none" stroke="#2B2D42" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- brilhos -->
  <path d="M168 150 v14 M161 157 h14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
