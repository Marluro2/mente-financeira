<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- TMA (Taxa Mínima de Atratividade): a barra mínima que o projeto precisa superar -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A8A"/>
      <stop offset="1" stop-color="#D62839"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="172" cy="170" r="48" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="30" cy="28" r="36" fill="#FFFFFF" opacity="0.1"/>
  <!-- chão -->
  <path d="M14 174 h172" stroke="#8C1424" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- postes -->
  <g fill="#F4F1EA" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round">
    <rect x="64" y="94" width="12" height="80" rx="4"/>
    <rect x="150" y="94" width="12" height="80" rx="4"/>
    <rect x="54" y="166" width="32" height="10" rx="4"/>
    <rect x="140" y="166" width="32" height="10" rx="4"/>
  </g>
  <!-- sarrafo (a taxa mínima) -->
  <rect x="52" y="104" width="122" height="14" rx="7" fill="#FFFFFF" stroke="#2B2D42" stroke-width="4"/>
  <g fill="#2B2D42">
    <rect x="76" y="106" width="14" height="10"/>
    <rect x="106" y="106" width="14" height="10"/>
    <rect x="136" y="106" width="14" height="10"/>
  </g>
  <!-- seta subindo e passando por cima -->
  <path d="M22 160 C24 100 60 46 146 48" fill="none" stroke="#2B2D42" stroke-width="16" stroke-linecap="round"/>
  <path d="M142 29 L176 48 L142 67 Z" fill="#FFD23F" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
  <path d="M22 160 C24 100 60 46 146 48" fill="none" stroke="#FFD23F" stroke-width="9" stroke-linecap="round"/>
  <!-- brilhos -->
  <path d="M110 140 v14 M103 147 h14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M176 84 v10 M171 89 h10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
