<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Custo de oportunidade: escolher um caminho é abrir mão do outro -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE66D"/>
      <stop offset="1" stop-color="#F2A900"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="100" cy="20" r="40" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="22" cy="176" r="40" fill="#FFFFFF" opacity="0.09"/>
  <!-- estrada que se divide -->
  <path d="M100 214 V150 L22 44 M100 150 L178 44" fill="none" stroke="#2B2D42" stroke-width="42" stroke-linejoin="round"/>
  <path d="M100 214 V150 L22 44 M100 150 L178 44" fill="none" stroke="#5B6178" stroke-width="34" stroke-linejoin="round"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <path d="M100 166 v12 M100 188 v12"/>
    <path d="M91.7 138.7 L85.2 129.9 M77.5 119.4 L71.0 110.5 M63.3 100.1 L56.7 91.2 M49.0 80.7 L42.5 71.9 M34.8 61.4 L28.3 52.5"/>
    <path d="M108.3 138.7 L114.8 129.9 M122.5 119.4 L129.0 110.5 M136.7 100.1 L143.3 91.2 M151.0 80.7 L157.5 71.9 M165.2 61.4 L171.7 52.5"/>
  </g>
  <!-- poste com placas -->
  <rect x="96" y="34" width="8" height="84" rx="3" fill="#8A5A36" stroke="#2B2D42" stroke-width="3"/>
  <path d="M44 50 L57 36 H106 V64 H57 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
  <path d="M94 72 H143 L156 86 L143 100 H94 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
  <!-- placa da esquerda: coração (lazer) -->
  <path d="M82 60 C70 52 66 46 70 42 C73 39 79 40 82 45 C85 40 91 39 94 42 C98 46 94 52 82 60 Z" fill="#FF3D8B" stroke="#2B2D42" stroke-width="2"/>
  <!-- placa da direita: moeda -->
  <circle cx="122" cy="86" r="10" fill="#FFD23F" stroke="#D99400" stroke-width="3"/>
  <circle cx="122" cy="86" r="4" fill="none" stroke="#D99400" stroke-width="2"/>
  <!-- brilhos -->
  <path d="M160 128 v14 M153 135 h14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 120 v10 M27 125 h10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
