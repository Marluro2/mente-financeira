<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Capacidade produtiva: fábrica e barra mostrando quanto dela está em uso -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9C2FF"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="30" cy="30" r="44" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="176" cy="178" r="36" fill="#FFFFFF" opacity="0.09"/>
  <!-- fábrica -->
  <path d="M24 102 V60 L56 78 V60 L88 78 V60 L120 78 V102 Z" fill="#F4F1EA" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
  <rect x="132" y="30" width="18" height="72" fill="#9AA1AC" stroke="#2B2D42" stroke-width="4"/>
  <rect x="20" y="100" width="164" height="8" rx="3" fill="#2B2D42"/>
  <g fill="#5CC8FF" stroke="#2B2D42" stroke-width="3">
    <rect x="36" y="84" width="12" height="10"/><rect x="68" y="84" width="12" height="10"/><rect x="100" y="84" width="12" height="10"/>
  </g>
  <!-- fumaça -->
  <circle cx="148" cy="20" r="9" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="164" cy="14" r="7" fill="#FFFFFF" opacity="0.6"/>
  <!-- barra de capacidade -->
  <rect x="20" y="126" width="164" height="40" rx="12" fill="#FFFFFF" stroke="#2B2D42" stroke-width="5"/>
  <g fill="#2EE59D">
    <rect x="30" y="135" width="26" height="22" rx="4"/>
    <rect x="61" y="135" width="26" height="22" rx="4"/>
    <rect x="92" y="135" width="26" height="22" rx="4"/>
    <rect x="123" y="135" width="26" height="22" rx="4"/>
  </g>
  <rect x="154" y="135" width="22" height="22" rx="4" fill="#E2E6F0"/>
  <!-- marcador -->
  <path d="M151 118 L151 172" stroke="#D62839" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5"/>
  <!-- brilhos -->
  <path d="M176 60 v12 M170 66 h12" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
