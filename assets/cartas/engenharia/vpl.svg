<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- VPL (Valor Presente Líquido): dinheiro do futuro trazido para hoje -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC8FF"/>
      <stop offset="1" stop-color="#1459D9"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="30" cy="30" r="46" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="178" cy="182" r="40" fill="#FFFFFF" opacity="0.09"/>
  <!-- calendário (o futuro) -->
  <rect x="104" y="30" width="72" height="70" rx="10" fill="#FFFFFF" stroke="#2B2D42" stroke-width="4"/>
  <path d="M104 52 V40 a10 10 0 0 1 10 -10 h52 a10 10 0 0 1 10 10 V52 Z" fill="#FF5C5C" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
  <rect x="118" y="20" width="9" height="18" rx="4.5" fill="#2B2D42"/>
  <rect x="153" y="20" width="9" height="18" rx="4.5" fill="#2B2D42"/>
  <g fill="#C9CED6">
    <rect x="114" y="60" width="12" height="10" rx="3"/>
    <rect x="134" y="60" width="12" height="10" rx="3"/>
    <rect x="154" y="60" width="12" height="10" rx="3"/>
    <rect x="114" y="78" width="12" height="10" rx="3"/>
    <rect x="134" y="78" width="12" height="10" rx="3"/>
  </g>
  <circle cx="160" cy="83" r="9" fill="#FFD23F" stroke="#D99400" stroke-width="3"/>
  <!-- seta curva voltando para hoje -->
  <path d="M98 50 C62 38 38 62 46 104" fill="none" stroke="#FFD23F" stroke-width="9" stroke-linecap="round"/>
  <path d="M33 98 L48 122 L60 96 Z" fill="#FFD23F" stroke="#FFD23F" stroke-width="4" stroke-linejoin="round"/>
  <!-- pilha de moedas (hoje) -->
  <g stroke="#D99400" stroke-width="4" stroke-linejoin="round">
    <path d="M42 136 v34 a30 10 0 0 0 60 0 v-34" fill="#FFD23F"/>
    <path d="M42 153 a30 10 0 0 0 60 0" fill="none"/>
    <ellipse cx="72" cy="136" rx="30" ry="10" fill="#FFE27A"/>
  </g>
  <!-- sinal positivo -->
  <circle cx="148" cy="146" r="26" fill="#2EE59D" stroke="#2B2D42" stroke-width="4"/>
  <path d="M148 132 v28 M134 146 h28" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <!-- brilhos -->
  <path d="M82 92 v12 M76 98 h12" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M184 116 v10 M179 121 h10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
