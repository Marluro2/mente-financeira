<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Análise de cenários: pessimista, provável e otimista lado a lado -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B5FF"/>
      <stop offset="1" stop-color="#A21CAF"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="30" cy="30" r="44" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="176" cy="178" r="36" fill="#FFFFFF" opacity="0.09"/>
  <!-- barras -->
  <g stroke="#2B2D42" stroke-width="4" stroke-linejoin="round">
    <rect x="22" y="132" width="40" height="40" rx="5" fill="#FF7A7A"/>
    <rect x="80" y="104" width="40" height="68" rx="5" fill="#FFD23F"/>
    <rect x="138" y="76" width="40" height="96" rx="5" fill="#2EE59D"/>
  </g>
  <!-- rostos -->
  <g stroke="#2B2D42" stroke-width="4">
    <circle cx="42" cy="104" r="18" fill="#FFFFFF"/>
    <circle cx="100" cy="76" r="18" fill="#FFFFFF"/>
    <circle cx="158" cy="48" r="18" fill="#FFFFFF"/>
  </g>
  <g fill="#2B2D42">
    <circle cx="36" cy="100" r="2.8"/><circle cx="48" cy="100" r="2.8"/>
    <circle cx="94" cy="72" r="2.8"/><circle cx="106" cy="72" r="2.8"/>
    <circle cx="152" cy="44" r="2.8"/><circle cx="164" cy="44" r="2.8"/>
  </g>
  <g fill="none" stroke="#2B2D42" stroke-width="3.5" stroke-linecap="round">
    <path d="M35 113 Q42 106 49 113"/>
    <path d="M93 83 H107"/>
    <path d="M150 52 Q158 60 166 52"/>
  </g>
  <!-- chão -->
  <path d="M12 173 H188" stroke="#2B2D42" stroke-width="5" stroke-linecap="round"/>
  <!-- brilhos -->
  <path d="M60 30 v12 M54 36 h12" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
