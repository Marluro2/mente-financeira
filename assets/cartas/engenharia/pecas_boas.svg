<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Peças boas: esteira com peças aprovadas (✓) e uma com defeito (✗) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BF0B6"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="170" cy="30" r="46" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="26" cy="180" r="38" fill="#FFFFFF" opacity="0.09"/>
  <!-- lupa -->
  <circle cx="64" cy="58" r="30" fill="#DFF6FF" fill-opacity="0.85" stroke="#2B2D42" stroke-width="6"/>
  <path d="M86 80 L108 102" stroke="#2B2D42" stroke-width="10" stroke-linecap="round"/>
  <path d="M50 58 L60 68 L80 46" fill="none" stroke="#15803D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- caixas na esteira -->
  <g stroke="#2B2D42" stroke-width="3.5" stroke-linejoin="round">
    <rect x="18" y="116" width="34" height="34" rx="4" fill="#E0A86A"/>
    <rect x="62" y="116" width="34" height="34" rx="4" fill="#E0A86A"/>
    <rect x="106" y="116" width="34" height="34" rx="4" fill="#E0A86A"/>
    <rect x="150" y="116" width="34" height="34" rx="4" fill="#C9B79C"/>
  </g>
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 133 L33 139 L44 126" stroke="#15803D"/>
    <path d="M71 133 L77 139 L88 126" stroke="#15803D"/>
    <path d="M115 133 L121 139 L132 126" stroke="#15803D"/>
    <path d="M159 125 L175 141 M175 125 L159 141" stroke="#D62839"/>
  </g>
  <!-- esteira -->
  <rect x="10" y="152" width="180" height="16" rx="8" fill="#3F4460" stroke="#2B2D42" stroke-width="4"/>
  <g fill="#B8BEC8"><circle cx="26" cy="160" r="4"/><circle cx="62" cy="160" r="4"/><circle cx="100" cy="160" r="4"/><circle cx="138" cy="160" r="4"/><circle cx="174" cy="160" r="4"/></g>
  <!-- brilhos -->
  <path d="M150 54 v14 M143 61 h14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
