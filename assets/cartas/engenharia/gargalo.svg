<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Gargalo: peças em fila esperando passar pelo gargalo da garrafa -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE58A"/>
      <stop offset="1" stop-color="#C27C00"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="170" cy="30" r="46" fill="#FFFFFF" opacity="0.13"/>
  <circle cx="26" cy="180" r="38" fill="#FFFFFF" opacity="0.09"/>
  <!-- garrafa deitada -->
  <path d="M20 70 H112 C126 70 132 86 146 88 H170 a6 6 0 0 1 6 6 V106 a6 6 0 0 1 -6 6 H146 C132 114 126 130 112 130 H20 a10 10 0 0 1 -10 -10 V80 a10 10 0 0 1 10 -10 Z" fill="#DFF6FF" fill-opacity="0.9" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/>
  <!-- peças lá dentro, apertadas perto do gargalo -->
  <g stroke="#2B2D42" stroke-width="3">
    <circle cx="40" cy="100" r="11" fill="#FF7A7A"/>
    <circle cx="66" cy="88" r="11" fill="#5CC8FF"/>
    <circle cx="66" cy="112" r="11" fill="#2EE59D"/>
    <circle cx="92" cy="100" r="11" fill="#FFD23F"/>
    <circle cx="114" cy="88" r="11" fill="#B98CFF"/>
    <circle cx="114" cy="112" r="11" fill="#FF7A7A"/>
    <circle cx="136" cy="100" r="10" fill="#5CC8FF"/>
    <circle cx="160" cy="100" r="9" fill="#FFD23F"/>
  </g>
  <!-- uma peça saindo -->
  <circle cx="190" cy="100" r="9" fill="#2EE59D" stroke="#2B2D42" stroke-width="3"/>
  <!-- relógio de espera -->
  <circle cx="60" cy="158" r="20" fill="#FFFFFF" stroke="#2B2D42" stroke-width="4"/>
  <path d="M60 158 V146 M60 158 L69 163" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>
  <path d="M96 154 h52 M96 166 h36" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- brilhos -->
  <path d="M44 30 v14 M37 37 h14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
