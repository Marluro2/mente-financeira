    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="32" cy="30" r="46" fill="#FFFFFF" opacity="0.13"/>
  <circle cx="176" cy="176" r="40" fill="#FFFFFF" opacity="0.09"/>
