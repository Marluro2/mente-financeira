  <path d="M78 66 L70 46 C82 52 88 42 96 42 C104 42 110 52 122 46 L114 66 Z" fill="#F4E3C1" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/>
  <path d="M74 68 H118" stroke="#B5651D" stroke-width="7" stroke-linecap="round"/>
  <!-- cifrão -->
  <path d="M110 108 C106 100 86 98 84 110 C82 124 112 120 110 136 C108 150 86 148 80 140" fill="none" stroke="#2EA043" stroke-width="7" stroke-linecap="round"/>
