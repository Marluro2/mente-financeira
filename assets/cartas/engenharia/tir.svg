<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- TIR (Taxa Interna de Retorno): medidor com ponteiro na zona verde -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C88BFF"/>
      <stop offset="1" stop-color="#7B1FD6"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="170" cy="32" r="48" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="26" cy="180" r="38" fill="#FFFFFF" opacity="0.09"/>
  <!-- corpo do medidor -->
  <path d="M22 120 A78 78 0 0 1 178 120 V128 a8 8 0 0 1 -8 8 H30 a8 8 0 0 1 -8 -8 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/>
  <!-- zonas: vermelha, amarela, verde -->
  <g fill="none" stroke-width="16">
    <path d="M42 120 A58 58 0 0 1 69.3 70.8" stroke="#FF5C5C"/>
    <path d="M72.8 68.8 A58 58 0 0 1 127.2 68.8" stroke="#FFD23F"/>
    <path d="M130.7 70.8 A58 58 0 0 1 158 120" stroke="#2EE59D"/>
  </g>
  <!-- marcas -->
  <path d="M100 42 v8 M151.4 66.6 l-5 5 M48.6 66.6 l5 5" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>
  <!-- ponteiro -->
  <path d="M95.7 114.5 L144.1 85.5 L104.3 125.5 Z" fill="#2B2D42" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="100" cy="120" r="11" fill="#2B2D42"/>
  <circle cx="100" cy="120" r="4.5" fill="#FFD23F"/>
  <!-- símbolo de porcentagem -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <circle cx="86" cy="157" r="7"/>
    <circle cx="114" cy="177" r="7"/>
    <path d="M116 152 L84 182"/>
  </g>
  <!-- brilhos -->
  <path d="M34 34 v14 M27 41 h14" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M164 158 v10 M159 163 h10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
