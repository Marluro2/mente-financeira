      <stop offset="0" stop-color="#FF9AD0"/>
      <stop offset="1" stop-color="#FF3D8B"/>
    </linearGradient>
    <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3EF"/>
      <stop offset="1" stop-color="#FFB8D5"/>
