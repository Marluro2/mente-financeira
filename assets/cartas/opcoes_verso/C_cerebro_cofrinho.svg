<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Opção C — Cérebro-cofrinho: a moeda entra no cérebro (conhecimento é investimento) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3D8B"/>
      <stop offset="1" stop-color="#7B1FD6"/>
    </linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3EF"/>
      <stop offset="1" stop-color="#FFB8D5"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="30" cy="30" r="46" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="176" cy="150" r="40" fill="#FFFFFF" opacity="0.08"/>
  <!-- moeda caindo -->
  <g transform="translate(100 24)">
    <circle r="15" fill="#FFD23F" stroke="#D99400" stroke-width="4"/>
    <circle r="7" fill="none" stroke="#D99400" stroke-width="2.5"/>
  </g>
  <path d="M82 18 l-7 -6 M118 18 l7 -6" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- cérebro -->
  <path d="M100 50 C87 43 67 45 60 56 C47 56 38 69 42 82 C33 89 35 107 46 112 C46 127 60 136 73 132 C80 141 96 141 100 134 C104 141 120 141 127 132 C140 136 154 127 154 112 C165 107 167 89 158 82 C162 69 153 56 140 56 C133 45 113 43 100 50 Z" fill="url(#brain)" stroke="#B0306A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M100 58 V132" stroke="#B0306A" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="none" stroke="#E0619B" stroke-width="4" stroke-linecap="round">
    <path d="M62 70 C72 66 80 72 82 80"/>
    <path d="M50 94 C60 90 68 96 68 104"/>
    <path d="M66 118 C74 110 86 114 88 122"/>
    <path d="M138 70 C128 66 120 72 118 80"/>
    <path d="M150 94 C140 90 132 96 132 104"/>
    <path d="M134 118 C126 110 114 114 112 122"/>
  </g>
  <!-- fenda do cofrinho -->
  <rect x="84" y="46" width="32" height="8" rx="4" fill="#7A1845"/>
  <!-- bochechas -->
  <ellipse cx="78" cy="98" rx="8" ry="5" fill="#FF7FB2" opacity="0.5"/>
  <ellipse cx="122" cy="98" rx="8" ry="5" fill="#FF7FB2" opacity="0.5"/>
  <!-- nome -->
  <text x="100" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="25" fill="#FFFFFF" letter-spacing="2">MENTE</text>
  <text x="100" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#FFD23F" letter-spacing="3">FINANCEIRA</text>
  </g>
</svg>
