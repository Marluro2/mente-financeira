<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A1C9C"/>
      <stop offset="0.55" stop-color="#7B1FD6"/>
      <stop offset="1" stop-color="#E4336F"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE98A"/>
      <stop offset="1" stop-color="#FFB000"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <!-- padrão de pontos -->
  <g fill="#FFFFFF" opacity="0.12">
    <circle cx="25" cy="25" r="4"/><circle cx="60" cy="25" r="4"/><circle cx="140" cy="25" r="4"/><circle cx="175" cy="25" r="4"/>
    <circle cx="25" cy="60" r="4"/><circle cx="175" cy="60" r="4"/>
    <circle cx="25" cy="140" r="4"/><circle cx="175" cy="140" r="4"/>
    <circle cx="25" cy="175" r="4"/><circle cx="60" cy="175" r="4"/><circle cx="140" cy="175" r="4"/><circle cx="175" cy="175" r="4"/>
  </g>
  <rect x="12" y="12" width="176" height="176" rx="28" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.35" stroke-dasharray="10 8"/>
  <!-- moeda central com ponto de interrogação -->
  <circle cx="100" cy="100" r="54" fill="#FFFFFF" opacity="0.14"/>
  <circle cx="100" cy="100" r="42" fill="url(#coin)" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="100" cy="100" r="32" fill="none" stroke="#D99400" stroke-width="3" stroke-dasharray="4 5"/>
  <path d="M86 88 a14 14 0 1 1 20 12 c-5 3 -6 6 -6 11" fill="none" stroke="#6B2A00" stroke-width="9" stroke-linecap="round"/>
  <circle cx="100" cy="124" r="5.5" fill="#6B2A00"/>
  <!-- brilhos -->
  <path d="M150 50 v16 M142 58 h16" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M48 146 v12 M42 152 h12" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
