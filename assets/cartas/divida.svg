<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AA3B8"/>
      <stop offset="1" stop-color="#3F4460"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#6B7089"/>
      <stop offset="1" stop-color="#1C1E2B"/>
    </radialGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="170" cy="30" r="46" fill="#FFFFFF" opacity="0.12"/>
  <!-- tornozeleira -->
  <rect x="22" y="40" width="44" height="26" rx="10" fill="none" stroke="#D0D5E0" stroke-width="8"/>
  <!-- corrente -->
  <g fill="none" stroke="#D0D5E0" stroke-width="7">
    <ellipse cx="64" cy="80" rx="12" ry="8" transform="rotate(40 64 80)"/>
    <ellipse cx="78" cy="96" rx="8" ry="12" transform="rotate(40 78 96)"/>
    <ellipse cx="92" cy="110" rx="12" ry="8" transform="rotate(40 92 110)"/>
  </g>
  <!-- bola de ferro -->
  <circle cx="126" cy="138" r="46" fill="url(#ball)"/>
  <ellipse cx="108" cy="118" rx="14" ry="9" fill="#FFFFFF" opacity="0.25" transform="rotate(-35 108 118)"/>
  <!-- símbolo de cifrão desenhado -->
  <path d="M138 122 c-4 -6 -24 -8 -24 4 c0 12 26 6 26 20 c0 12 -22 12 -28 4" fill="none" stroke="#FF5C5C" stroke-width="7" stroke-linecap="round"/>
  <path d="M126 112 v52" stroke="#FF5C5C" stroke-width="6" stroke-linecap="round"/>
  <!-- rachaduras de peso -->
  <path d="M60 178 h40 M150 186 h28" stroke="#2A2D3E" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
