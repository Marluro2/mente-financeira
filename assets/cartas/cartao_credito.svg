<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F88FF"/>
      <stop offset="1" stop-color="#4331D6"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2D42"/>
      <stop offset="1" stop-color="#11121C"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A62"/>
      <stop offset="1" stop-color="#FF5470"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="1" stop-color="#E0A800"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="30" cy="170" r="48" fill="#FFFFFF" opacity="0.12"/>
  <!-- cartão de trás -->
  <g transform="rotate(14 100 100)">
    <rect x="40" y="52" width="124" height="80" rx="12" fill="url(#back)"/>
    <rect x="40" y="68" width="124" height="16" fill="#3A1F2E" opacity="0.55"/>
  </g>
  <!-- cartão da frente -->
  <g transform="rotate(-10 100 110)">
    <rect x="30" y="76" width="130" height="84" rx="12" fill="url(#front)"/>
    <rect x="46" y="98" width="28" height="22" rx="5" fill="url(#chip)"/>
    <path d="M46 109 h28 M60 98 v22" stroke="#B88A00" stroke-width="2"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <path d="M86 101 a10 10 0 0 1 0 16"/>
      <path d="M93 97 a16 16 0 0 1 0 24"/>
    </g>
    <g fill="#FFFFFF" opacity="0.8">
      <rect x="46" y="132" width="18" height="6" rx="3"/>
      <rect x="70" y="132" width="18" height="6" rx="3"/>
      <rect x="94" y="132" width="18" height="6" rx="3"/>
      <rect x="118" y="132" width="18" height="6" rx="3"/>
    </g>
    <circle cx="134" cy="104" r="9" fill="#FF5470" opacity="0.9"/>
    <circle cx="144" cy="104" r="9" fill="#FFB547" opacity="0.9"/>
  </g>
  <!-- alerta de juros -->
  <circle cx="160" cy="44" r="20" fill="#FFD23F" stroke="#FFFFFF" stroke-width="4"/>
  <rect x="157" y="32" width="6" height="15" rx="3" fill="#3A2E24"/>
  <circle cx="160" cy="54" r="3.5" fill="#3A2E24"/>
  </g>
</svg>
