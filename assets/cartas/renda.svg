<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE66D"/>
      <stop offset="1" stop-color="#F2A900"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A5A36"/>
      <stop offset="1" stop-color="#5E3A20"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="170" cy="170" r="50" fill="#FFFFFF" opacity="0.16"/>
  <!-- notas saindo -->
  <g transform="rotate(-12 90 70)">
    <rect x="44" y="44" width="96" height="50" rx="6" fill="#3DBE7A" stroke="#1E7F4C" stroke-width="3"/>
    <circle cx="92" cy="69" r="13" fill="none" stroke="#1E7F4C" stroke-width="3"/>
  </g>
  <g transform="rotate(8 110 70)">
    <rect x="62" y="44" width="96" height="50" rx="6" fill="#52D48E" stroke="#1E7F4C" stroke-width="3"/>
    <circle cx="110" cy="69" r="13" fill="none" stroke="#1E7F4C" stroke-width="3"/>
    <path d="M72 54 h12 M136 84 h12" stroke="#1E7F4C" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- carteira -->
  <rect x="30" y="86" width="140" height="92" rx="16" fill="url(#wallet)"/>
  <path d="M30 104 h140" stroke="#4A2E18" stroke-width="3" opacity="0.6"/>
  <path d="M112 118 h58 v38 h-58 a19 19 0 0 1 0 -38 z" fill="#A87148"/>
  <circle cx="118" cy="137" r="8" fill="#FFD23F" stroke="#D99400" stroke-width="3"/>
  <path d="M40 166 h40" stroke="#C99A6E" stroke-width="3" stroke-dasharray="6 5"/>
  <!-- moeda -->
  <circle cx="160" cy="44" r="18" fill="#FFD23F" stroke="#D99400" stroke-width="4"/>
  <circle cx="160" cy="44" r="8" fill="none" stroke="#D99400" stroke-width="2.5"/>
  </g>
</svg>
