# Hospedagem do modo online no Render (plano gratuito).
# No Render: New > Blueprint > escolher este repositório. O site do GitHub
# Pages não muda; este serviço é só a sala de espera e o duelo online.
# No plano gratuito o servidor dorme sem uso e leva cerca de 1 minuto para acordar.
services:
  - type: web
    name: mente-financeira-online
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python servidor_online.py
    healthCheckPath: /api/online
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
