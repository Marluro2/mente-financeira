[[questions]]
id = "N2-01"
level = 2
topic = "Payback"
item = "Prensa hidráulica"
question = "Uma metalúrgica compra uma prensa hidráulica por R$ 24.000,00, que gera retorno líquido de R$ 2.000,00 por mês. Qual é o payback simples?"
