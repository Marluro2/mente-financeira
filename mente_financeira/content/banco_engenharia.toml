# Banco de questões — Engenharia de Produção (Desafio Relâmpago por nível)
#
# 120 questões objetivas: 40 por nível, 10 por assunto. A cada par formado no
# jogo da memória (Solo e Duelo) sai uma questão do nível escolhido, sem
# repetir até acabarem as 40; no Duelo online e no quiz do telão, que não têm
# nível, as 120 se misturam.
#
# Base: banco de questões em PDF feito para o projeto, com cenários variados,
# alternativas revistas e uma explicação curta para cada questão.
#
# Cada [[questions]]:
# - `answer` é a alternativa certa e `wrong` as três erradas (o jogo embaralha);
# - `explanation` aparece depois da resposta (\n quebra a linha);
# - `item` é o título curto mostrado acima da pergunta.
# As alternativas são curtas para caber nos botões do jogo (até ~35 letras).
# Depois de editar, rode `python -m pytest`.

