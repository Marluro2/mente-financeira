# Nível 2 — Decisões de investimento

[[questions]]
id = "N2-31"
level = 2
topic = "Decisões de investimento"
item = "Escolha entre projetos"
question = "Uma fábrica deve escolher entre dois projetos de mesmo risco. O projeto A tem VPL de R$ 8.000,00 e o B, de R$ 5.000,00. Qual cria mais valor?"
answer = "Projeto A"
wrong = ["Projeto B", "Os dois criam o mesmo valor", "Não dá para comparar VPLs"]
explanation = "Com o mesmo risco, cria mais valor o projeto de maior VPL.\nR$ 8.000,00 (A) é maior que R$ 5.000,00 (B)."

[[questions]]
id = "N2-32"
level = 2
topic = "Decisões de investimento"
item = "VPL positivo"
question = "O VPL de um projeto, calculado com a TMA da empresa, deu positivo. O que isso indica?"
answer = "Rende mais que a TMA"
wrong = ["Se paga em menos de um ano", "Dá esse lucro todo ano", "A TIR é menor que a TMA"]
explanation = "VPL positivo quer dizer que, descontadas pela TMA, as entradas valem hoje mais do que o investimento.\nO projeto rende mais que o mínimo exigido."

[[questions]]
id = "N2-33"
level = 2
topic = "Decisões de investimento"
item = "TIR × TMA"
question = "A TIR de um projeto é 18% ao ano e a TMA da empresa é 12% ao ano. Pela regra da TIR, o que fazer?"
answer = "Aceitar: TIR maior que a TMA"
wrong = ["Rejeitar: TIR maior que a TMA", "Aceitar só se a TIR = TMA", "Rejeitar: 6% é pouco"]
explanation = "Regra da TIR: aceita-se o projeto quando a TIR é maior que a TMA.\n18% > 12%, então o projeto rende acima do mínimo exigido."

[[questions]]
id = "N2-34"
level = 2
topic = "Decisões de investimento"
item = "VPL negativo"
question = "O VPL de um projeto, calculado com a TMA da empresa, deu −R$ 2.000,00. Qual é a interpretação correta?"
answer = "Rende menos que a TMA"
wrong = ["Dá R$ 2.000,00 de prejuízo por ano", "Rende exatamente a TMA", "O payback é negativo"]
explanation = "VPL negativo: descontadas pela TMA, as entradas valem hoje menos que o investimento.\nO projeto não paga o retorno mínimo; não quer dizer prejuízo de R$ 2.000,00 por ano."

[[questions]]
id = "N2-35"
level = 2
topic = "Decisões de investimento"
item = "Duas máquinas"
question = "Uma máquina custa R$ 20.000,00 e economiza R$ 4.000,00 por ano; outra custa R$ 25.000,00 e economiza R$ 6.000,00 por ano. O que mais é preciso saber antes de decidir?"
answer = "Vida útil e manutenção"
wrong = ["Nada: a mais cara é melhor", "Nada: a mais barata é melhor", "Só o preço à vista"]
explanation = "Preço e economia anual não bastam: uma máquina que dura menos ou custa mais para manter pode render menos no total.\nPor isso se olha também a vida útil e os custos de operação e manutenção."

[[questions]]
id = "N2-36"
level = 2
topic = "Decisões de investimento"
item = "Vidas úteis diferentes"
question = "Uma fábrica compara dois investimentos: um dura 3 anos e o outro, 6 anos. Qual cuidado é importante?"
answer = "Usar o mesmo horizonte"
wrong = ["Comparar o VPL de cada um direto", "Escolher sempre o que dura mais", "Comparar só o preço de compra"]
explanation = "VPLs de 3 e de 6 anos não se comparam direto.\nUsa-se o mesmo horizonte (repetindo o projeto mais curto) ou o valor anual equivalente."

[[questions]]
id = "N2-37"
level = 2
topic = "Decisões de investimento"
item = "TMA"
question = "A taxa mínima de atratividade (TMA) representa:"
answer = "O retorno mínimo exigido"
wrong = ["Os juros do financiamento", "O lucro do ano passado", "A TIR do projeto"]
explanation = "A TMA é o mínimo que um investimento precisa render para valer a pena, em geral o que se ganharia em outra aplicação de risco parecido.\nA TIR é calculada; a TMA é escolhida pela empresa."

[[questions]]
id = "N2-38"
level = 2
topic = "Decisões de investimento"
item = "Taxa de desconto"
question = "Se a taxa de desconto aumenta e os fluxos futuros continuam iguais, o valor presente de uma entrada futura:"
answer = "Diminui"
wrong = ["Aumenta", "Fica igual", "Fica negativo"]
explanation = "Valor presente = valor futuro ÷ (1 + taxa).\nCom a taxa maior, divide-se por um número maior e o valor de hoje fica menor."

[[questions]]
id = "N2-39"
level = 2
topic = "Decisões de investimento"
item = "Financiamento"
question = "Uma empresa vai financiar uma máquina. Além do preço, o que deve analisar?"
answer = "Juros, tarifas e prazo"
wrong = ["Só se a parcela cabe no caixa", "Só a taxa de juros anunciada", "Só o valor da entrada"]
explanation = "Uma parcela que cabe no caixa pode esconder juros altos.\nO que importa é o custo total do financiamento: juros, tarifas, seguros e prazo (o CET)."

[[questions]]
id = "N2-40"
level = 2
topic = "Decisões de investimento"
item = "Risco"
question = "Ao comparar investimentos, por que é importante analisar o risco?"
answer = "O futuro é incerto"
wrong = ["Mais risco sempre rende mais", "Com pouco risco, o VPL é positivo", "Risco só importa em valores altos"]
explanation = "Os fluxos de caixa futuros são estimativas e podem variar.\nAnalisar o risco mostra o quanto o resultado pode mudar; mais risco costuma exigir uma TMA maior."

# ----------------------------------------------------------------------
# Nível 3 — Ponto de equilíbrio

[[questions]]
id = "N3-01"
level = 3
topic = "Ponto de equilíbrio"
item = "Fábrica de camisetas"
question = "Uma fábrica de camisetas tem custos fixos de R$ 10.000,00 por mês. Cada camiseta é vendida por R$ 20,00 e tem custo variável de R$ 10,00. Quantas camisetas precisa vender para atingir o ponto de equilíbrio?"
answer = "1.000 camisetas"
wrong = ["900 camisetas", "1.100 camisetas", "500 camisetas"]
explanation = "Cada camiseta deixa R$ 20,00 − R$ 10,00 = R$ 10,00 para pagar os custos fixos (margem de contribuição).\nPonto de equilíbrio = R$ 10.000,00 ÷ R$ 10,00 = 1.000 camisetas."

[[questions]]
id = "N3-02"
level = 3
topic = "Ponto de equilíbrio"
item = "Fábrica de luminárias"
question = "Uma fábrica de luminárias tem custos fixos de R$ 15.000,00 por mês. Cada luminária é vendida por R$ 50,00 e tem custo variável de R$ 20,00. Quantas luminárias precisa vender para atingir o ponto de equilíbrio?"
answer = "500 luminárias"
wrong = ["300 luminárias", "400 luminárias", "600 luminárias"]
explanation = "Cada luminária deixa R$ 50,00 − R$ 20,00 = R$ 30,00 para pagar os custos fixos (margem de contribuição).\nPonto de equilíbrio = R$ 15.000,00 ÷ R$ 30,00 = 500 luminárias."

