wrong = ["R$ 3.300,00", "R$ 3.480,00", "R$ 3.120,00"]
explanation = "Juros simples: 4% de R$ 3.000,00 = R$ 120,00 por ano × 2 anos = R$ 240,00.\nMontante: R$ 3.000,00 + R$ 240,00 = R$ 3.240,00."

