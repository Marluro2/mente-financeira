# Nível 3 — Desperdício e eficiência

[[questions]]
id = "N3-21"
level = 3
topic = "Desperdício e eficiência"
item = "Matéria-prima"
question = "Uma fábrica usa 1.000 kg de matéria-prima por mês e reduz o desperdício de 10% para 5%. Quantos kg deixa de desperdiçar?"
answer = "50 kg"
wrong = ["25 kg", "100 kg", "150 kg"]
explanation = "Antes: 10% de 1.000 kg = 100 kg. Depois: 5% de 1.000 kg = 50 kg.\nDeixa de desperdiçar 100 − 50 = 50 kg."

[[questions]]
id = "N3-22"
level = 3
topic = "Desperdício e eficiência"
item = "Consumo de energia"
question = "Uma máquina consome 500 kWh por mês. Após uma melhoria, o consumo cai 20%. Quantos kWh são economizados por mês?"
answer = "100 kWh"
wrong = ["80 kWh", "120 kWh", "50 kWh"]
explanation = "20% de 500 kWh = 500 × 0,20 = 100 kWh por mês."

[[questions]]
id = "N3-23"
level = 3
topic = "Desperdício e eficiência"
item = "Peças descartadas"
question = "Uma fábrica descarta 80 peças por semana e reduz as perdas em 25%. Quantas peças deixa de descartar por semana?"
answer = "20 peças"
wrong = ["15 peças", "60 peças", "25 peças"]
explanation = "25% de 80 peças = 80 ÷ 4 = 20 peças por semana."

[[questions]]
id = "N3-24"
level = 3
topic = "Desperdício e eficiência"
item = "Conta de energia"
question = "Uma operação gasta R$ 2.000,00 por mês com energia e reduz esse gasto em 15%. Qual é a economia mensal?"
answer = "R$ 300,00"
wrong = ["R$ 200,00", "R$ 350,00", "R$ 150,00"]
explanation = "15% de R$ 2.000,00 = R$ 2.000,00 × 0,15 = R$ 300,00 por mês."

[[questions]]
id = "N3-25"
level = 3
topic = "Desperdício e eficiência"
item = "Controle de qualidade"
question = "Uma linha fabrica 2.000 unidades e 4% apresentam defeito. Quantas unidades defeituosas são esperadas?"
answer = "80 unidades"
wrong = ["60 unidades", "100 unidades", "40 unidades"]
explanation = "4% de 2.000 = 2.000 × 0,04 = 80 unidades com defeito."

[[questions]]
id = "N3-26"
level = 3
topic = "Desperdício e eficiência"
item = "Tempo de produção"
question = "Uma melhoria reduz o tempo de produção de 10 para 8 minutos por peça. Qual é a redução percentual do tempo?"
answer = "20%"
wrong = ["25%", "10%", "15%"]
explanation = "Redução: 10 − 8 = 2 minutos.\n2 ÷ 10 = 0,20 = 20% (compara-se com o tempo de antes)."

[[questions]]
id = "N3-27"
level = 3
topic = "Desperdício e eficiência"
item = "Consumo de água"
question = "Uma fábrica consome 1.200 litros de água por dia e reduz o consumo em 10%. Quanto economiza por dia?"
answer = "120 litros"
wrong = ["100 litros", "110 litros", "150 litros"]
explanation = "10% de 1.200 litros = 1.200 ÷ 10 = 120 litros por dia."

[[questions]]
id = "N3-28"
level = 3
topic = "Desperdício e eficiência"
item = "Desperdício de material"
question = "O desperdício de material custa R$ 4.000,00 por mês. Uma ação reduz esse desperdício em 30%. Qual é a economia mensal?"
answer = "R$ 1.200,00"
wrong = ["R$ 900,00", "R$ 1.000,00", "R$ 1.400,00"]
explanation = "30% de R$ 4.000,00 = R$ 4.000,00 × 0,30 = R$ 1.200,00 por mês."

[[questions]]
id = "N3-29"
level = 3
topic = "Desperdício e eficiência"
item = "Produção por turno"
question = "Uma máquina produzia 400 peças por turno e passou a produzir 500. Qual é o aumento percentual da produção?"
answer = "25%"
wrong = ["30%", "20%", "40%"]
explanation = "Aumento: 500 − 400 = 100 peças.\n100 ÷ 400 = 0,25 = 25% (compara-se com a produção de antes)."

[[questions]]
id = "N3-30"
level = 3
topic = "Desperdício e eficiência"
item = "Retrabalho"
question = "Uma empresa reduziu o retrabalho de 200 para 150 peças por mês. Qual é a redução percentual?"
answer = "25%"
wrong = ["20%", "30%", "50%"]
explanation = "Redução: 200 − 150 = 50 peças.\n50 ÷ 200 = 0,25 = 25%."

# ----------------------------------------------------------------------
# Nível 3 — Cenários e decisões de produção

[[questions]]
id = "N3-31"
level = 3
topic = "Cenários e decisões de produção"
item = "Qual máquina se paga antes?"
question = "Uma fábrica pode comprar uma máquina de R$ 40.000,00 que economiza R$ 10.000,00 por ano, ou outra de R$ 50.000,00 que economiza R$ 15.000,00 por ano. Pelo payback simples, qual se paga antes?"
answer = "A de R$ 50.000,00"
wrong = ["A de R$ 40.000,00", "As duas no mesmo prazo", "Não dá para calcular"]
explanation = "R$ 40.000,00 ÷ R$ 10.000,00 = 4 anos.\nR$ 50.000,00 ÷ R$ 15.000,00 ≈ 3,3 anos: a mais cara se paga antes."

[[questions]]
id = "N3-32"
level = 3
topic = "Cenários e decisões de produção"
item = "Produtividade"
question = "Uma linha produz 1.000 peças em 8 horas. Qual é a produtividade média por hora?"
answer = "125 peças/hora"
wrong = ["100 peças/hora", "800 peças/hora", "120 peças/hora"]
explanation = "Produtividade = produção ÷ tempo.\n1.000 peças ÷ 8 horas = 125 peças por hora."

[[questions]]
id = "N3-33"
level = 3
topic = "Cenários e decisões de produção"
item = "Receita total"
question = "Uma fábrica vende 500 unidades por R$ 30,00 cada. Qual é a receita total?"
answer = "R$ 15.000,00"
wrong = ["R$ 12.000,00", "R$ 18.000,00", "R$ 10.000,00"]
explanation = "Receita = quantidade × preço.\n500 × R$ 30,00 = R$ 15.000,00."

[[questions]]
id = "N3-34"
level = 3
topic = "Cenários e decisões de produção"
item = "Lucro do mês"
question = "Uma fábrica teve receita de R$ 50.000,00 e custos totais de R$ 38.000,00 no mês. Qual foi o lucro?"
answer = "R$ 12.000,00"
wrong = ["R$ 8.000,00", "R$ 10.000,00", "R$ 88.000,00"]
explanation = "Lucro = receita − custos totais.\nR$ 50.000,00 − R$ 38.000,00 = R$ 12.000,00."

[[questions]]
id = "N3-35"
level = 3
topic = "Cenários e decisões de produção"
item = "Economia líquida"
question = "Uma máquina custa R$ 30.000,00. A manutenção anual é de R$ 2.000,00 e a economia anual esperada é de R$ 10.000,00. Qual é a economia líquida anual?"
answer = "R$ 8.000,00"
wrong = ["R$ 12.000,00", "R$ 10.000,00", "R$ 2.000,00"]
explanation = "Economia líquida = economia − manutenção.\nR$ 10.000,00 − R$ 2.000,00 = R$ 8.000,00 por ano (o preço da máquina entra no payback, não nessa conta)."

[[questions]]
id = "N3-36"
level = 3
topic = "Cenários e decisões de produção"
item = "Capacidade produtiva"
question = "Uma fábrica tem capacidade para produzir 2.000 unidades por mês e produz 1.500. Qual é a utilização da capacidade?"
answer = "75%"
wrong = ["80%", "70%", "65%"]
explanation = "Utilização = produção ÷ capacidade.\n1.500 ÷ 2.000 = 0,75 = 75%."

[[questions]]
id = "N3-37"
level = 3
topic = "Cenários e decisões de produção"
item = "Economia incerta"
question = "Uma empresa estima economia de R$ 12.000,00 por ano com uma melhoria, mas esse valor pode variar. O que fazer antes de aprovar o projeto?"
answer = "Testar cenários"
wrong = ["Usar só a estimativa de R$ 12.000,00", "Aprovar logo: economia é sempre boa", "Esperar a economia para calcular"]
explanation = "Quando o valor pode variar, testa-se o projeto em cenários (pessimista, provável e otimista).\nSe ele vale a pena até no pessimista, a decisão é mais segura."

[[questions]]
id = "N3-38"
level = 3
topic = "Cenários e decisões de produção"
item = "Rendimento"
question = "Um processo produz 900 unidades boas de um total de 1.000 fabricadas. Qual é o rendimento de peças boas?"
answer = "90%"
wrong = ["9%", "10%", "110%"]
explanation = "Rendimento = peças boas ÷ total fabricado.\n900 ÷ 1.000 = 0,90 = 90%."

[[questions]]
id = "N3-39"
level = 3
topic = "Cenários e decisões de produção"
item = "Payback de melhoria"
question = "Uma melhoria custa R$ 6.000,00 e economiza R$ 1.000,00 por mês. Qual é o payback simples?"
answer = "6 meses"
wrong = ["5 meses", "7 meses", "12 meses"]
explanation = "Payback = investimento ÷ economia por mês.\nR$ 6.000,00 ÷ R$ 1.000,00 = 6 meses."

[[questions]]
id = "N3-40"
level = 3
topic = "Cenários e decisões de produção"
item = "Dois bons projetos"
question = "Dois projetos têm VPL positivo e riscos parecidos, mas a fábrica só pode fazer um. O que ajuda a decidir?"
answer = "Prazo, recursos e objetivos"
wrong = ["Sempre o de maior TIR", "Sempre o mais barato", "Sorteio: os dois são bons"]
explanation = "Com VPLs positivos e riscos parecidos, entram outros critérios: em quanto tempo o dinheiro volta, se há recursos (dinheiro, pessoas, espaço) e o que combina com os objetivos da fábrica.\nEscolher só pela maior TIR pode levar ao projeto de menor VPL."
