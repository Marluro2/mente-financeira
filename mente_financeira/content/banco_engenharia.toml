# Nível 2 — TIR

[[questions]]
id = "N2-21"
level = 2
topic = "TIR"
item = "Ferramenta de corte"
question = "Uma oficina investe R$ 1.000,00 hoje em uma ferramenta de corte e recebe R$ 1.100,00 de volta daqui a um ano. Qual é a TIR, ao ano?"
answer = "10%"
wrong = ["15%", "5%", "20%"]
explanation = "Com uma única entrada depois de 1 ano, a TIR é o quanto o dinheiro cresceu.\nR$ 1.100,00 ÷ R$ 1.000,00 = 1,10, ou seja, TIR = 10% ao ano."

