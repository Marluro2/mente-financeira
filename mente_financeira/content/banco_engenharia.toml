# ----------------------------------------------------------------------
# Nível 1 — Fluxo de caixa

[[questions]]
id = "N1-01"
level = 1
topic = "Fluxo de caixa"
item = "Padaria industrial"
question = "Em março, uma padaria industrial recebeu R$ 8.000,00 com vendas e pagou R$ 5.000,00 em despesas. Qual foi o fluxo de caixa líquido do mês?"
answer = "R$ 3.000,00"
wrong = ["R$ 1.500,00", "R$ 13.000,00", "R$ 5.500,00"]
explanation = "Fluxo de caixa líquido = entradas − saídas.\nR$ 8.000,00 − R$ 5.000,00 = R$ 3.000,00."

