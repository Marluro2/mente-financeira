# Nível 2 — VPL

[[questions]]
id = "N2-11"
level = 2
topic = "VPL"
item = "Melhoria na linha"
question = "Uma melhoria na linha custa R$ 1.000,00 hoje e traz R$ 1.100,00 daqui a um ano. Com TMA de 10% ao ano, qual é o VPL?"
answer = "R$ 0,00"
wrong = ["R$ 100,00", "−R$ 100,00", "R$ 10,00"]
explanation = "Valor de hoje da entrada: R$ 1.100,00 ÷ 1,10 = R$ 1.000,00.\nVPL = R$ 1.000,00 − R$ 1.000,00 = R$ 0,00: o projeto rende exatamente a TMA."

[[questions]]
id = "N2-12"
level = 2
topic = "VPL"
item = "Molde novo"
question = "Um molde novo custa R$ 1.000,00 hoje e gera R$ 1.200,00 daqui a um ano. Com TMA de 10% ao ano, qual é o VPL, aproximadamente?"
answer = "R$ 90,91"
wrong = ["R$ 190,91", "−R$ 9,09", "R$ 200,00"]
explanation = "Valor de hoje da entrada: R$ 1.200,00 ÷ 1,10 ≈ R$ 1.090,91.\nVPL = R$ 1.090,91 − R$ 1.000,00 = R$ 90,91: o projeto rende mais que a TMA e vale a pena."

