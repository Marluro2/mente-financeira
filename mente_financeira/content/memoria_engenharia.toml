# Baralho da Memória Financeira — Engenharia de Produção
#
# Mesmo formato de memoria.toml: cada [[concepts]] vira um par de cartas e a
# cada partida são sorteados `pairs` conceitos. O tema é engenharia econômica
# (decisões de uma fábrica), e cada exemplo liga a conta a uma decisão da
# empresa ou da vida pessoal. Confira as contas ao editar.
#
# `level` diz em qual nível da Engenharia a carta aparece (página de níveis):
# cada nível precisa de pelo menos `pairs` cartas. O Duelo online e o quiz do
# telão, que não têm nível, usam todas as cartas.
#
# Ilustrações: assets/cartas/engenharia/ (SVG de 200 × 200).

pairs = 8
back_image = "cartas/verso.svg"

# --------------------------------------------------------------------------
# Nível 1 — Fundamentos financeiros e de custos

[[concepts]]
id = "fluxo_caixa"
level = 1
name = "Fluxo de caixa"
image = "cartas/engenharia/fluxo_caixa.svg"
color = "#0B9486"
tip = "É o registro de todo dinheiro que entra e sai, mês a mês. Lucro no papel não paga as contas: quem paga é o caixa."
example = "Uma oficina recebe R$ 30.000 no mês e paga R$ 22.000 de salários, peças e aluguel: fluxo de caixa de + R$ 8.000."

[[concepts]]
id = "custos"
level = 1
name = "Custo fixo e variável"
image = "cartas/engenharia/custos.svg"
color = "#3E9A1E"
tip = "Custo fixo não muda com a produção, como o aluguel. Custo variável cresce com ela, como a matéria-prima."
example = "Padaria com R$ 3.000 de aluguel e R$ 0,40 de farinha por pão: fazendo 5.000 pães, o custo total é 3.000 + 5.000 × 0,40 = R$ 5.000."

[[concepts]]
id = "depreciacao"
level = 1
name = "Depreciação"
image = "cartas/engenharia/depreciacao.svg"
color = "#3F4460"
tip = "Máquinas, carros e computadores perdem valor com o uso e o tempo. Contar essa perda evita achar que o lucro é maior do que é."
example = "Um notebook de R$ 4.000 com vida útil de 4 anos perde R$ 1.000 por ano (depreciação linear). Depois de 2 anos, vale R$ 2.000."

[[concepts]]
id = "margem_contribuicao"
level = 1
name = "Margem de contribuição"
image = "cartas/engenharia/margem_contribuicao.svg"
color = "#FF3D8B"
tip = "É o que sobra de cada venda para pagar os custos fixos e dar lucro: preço de venda menos custo variável."
example = "Hambúrguer vendido a R$ 25 com R$ 10 de ingredientes deixa R$ 15 de margem. Com R$ 4.500 de custos fixos, são 300 lanches para empatar."

[[concepts]]
id = "receita"
level = 1
name = "Receita"
image = "cartas/engenharia/receita.svg"
color = "#11915A"
tip = "É todo o dinheiro que entra com as vendas: preço de venda vezes quantidade vendida. Receita ainda não é lucro, porque dela saem os custos."
example = "Uma fábrica de bonés vende 800 bonés a R$ 35 no mês: receita de 800 × 35 = R$ 28.000."

[[concepts]]
id = "lucro"
level = 1
name = "Lucro"
image = "cartas/engenharia/lucro.svg"
color = "#E07A00"
tip = "É o que sobra da receita depois de pagar todos os custos. Se os custos passam da receita, o resultado é prejuízo."
example = "Com receita de R$ 28.000 e custos de R$ 21.500 no mês, a fábrica de bonés tem lucro de 28.000 − 21.500 = R$ 6.500."

[[concepts]]
id = "porcentagem"
level = 1
name = "Porcentagem"
image = "cartas/engenharia/porcentagem.svg"
color = "#E0245E"
tip = "Porcentagem é uma parte de 100. Para aumentar um preço, multiplique por (1 + taxa); para dar desconto, por (1 − taxa)."
example = "Uma peça de R$ 360 com aumento de 25% passa a custar 360 × 1,25 = R$ 450. Com desconto de 25%, sai por 360 × 0,75 = R$ 270."

[[concepts]]
id = "juros_simples"
level = 1
name = "Juros simples"
image = "cartas/engenharia/juros_simples.svg"
color = "#0F766E"
tip = "Nos juros simples, a taxa incide só sobre o valor inicial. Por isso os juros são iguais em todos os períodos."
example = "R$ 1.500 aplicados a 6% ao ano por 4 anos rendem 1.500 × 0,06 × 4 = R$ 360 de juros. O montante fica em R$ 1.860."

# --------------------------------------------------------------------------
# Nível 2 — Avaliação de investimentos

[[concepts]]
id = "payback"
level = 2
name = "Payback"
image = "cartas/engenharia/payback.svg"
color = "#FF7A1A"
tip = "É o tempo que um investimento leva para se pagar. Quanto menor o payback, mais cedo o dinheiro volta e menor o risco."
example = "Placas solares de R$ 12.000 que economizam R$ 250 por mês na conta de luz se pagam em 12.000 ÷ 250 = 48 meses (4 anos)."

[[concepts]]
id = "vpl"
level = 2
name = "VPL"
image = "cartas/engenharia/vpl.svg"
color = "#1459D9"
tip = "Valor Presente Líquido: traz os ganhos futuros para hoje, descontados pela TMA, e tira o investimento. VPL positivo, vale a pena."
example = "Máquina de R$ 9.000 que rende R$ 12.100 daqui a 2 anos, com TMA de 10% ao ano: 12.100 ÷ 1,1² = R$ 10.000 hoje. VPL = R$ 1.000."

[[concepts]]
id = "tir"
level = 2
name = "TIR"
image = "cartas/engenharia/tir.svg"
color = "#7B1FD6"
tip = "Taxa Interna de Retorno: é o quanto o próprio projeto rende, a taxa que zera o VPL. Se a TIR passa da TMA, o projeto vale a pena."
example = "Aplicar R$ 1.000 num projeto e receber R$ 1.100 em um ano dá TIR de 10% ao ano. Ganha de uma poupança a 7%, perde de um CDB a 12%."

[[concepts]]
id = "tma"
level = 2
name = "TMA"
image = "cartas/engenharia/tma.svg"
color = "#D62839"
tip = "Taxa Mínima de Atratividade: o mínimo que um investimento precisa render para valer a pena, em geral o que uma aplicação segura paga."
example = "Se uma aplicação segura rende 10% ao ano, um negócio que promete 8% ao ano não compensa: tem mais risco e rende menos."

[[concepts]]
id = "valor_presente"
level = 2
name = "Dinheiro no tempo"
image = "cartas/engenharia/valor_presente.svg"
color = "#1FA45C"
tip = "R$ 100 hoje valem mais que R$ 100 daqui a um ano, porque hoje já podem render. Por isso se comparam valores na mesma data."
example = "Com juros de 10% ao ano, receber R$ 1.100 daqui a 1 ano equivale a ter R$ 1.000 hoje: 1.100 ÷ 1,10 = R$ 1.000."

[[concepts]]
id = "sac_price"
level = 2
name = "SAC x Price"
image = "cartas/engenharia/sac_price.svg"
color = "#4331D6"
tip = "No SAC as parcelas começam altas e caem; na Price são todas iguais. No total, o SAC costuma cobrar menos juros."
example = "R$ 12.000 em 12 meses a 1% ao mês: no SAC a 1ª parcela é 1.000 + 120 = R$ 1.120 e a última, R$ 1.010. Na Price, todas ficam em R$ 1.066,19."

[[concepts]]
id = "custo_oportunidade"
level = 2
name = "Custo de oportunidade"
image = "cartas/engenharia/custo_oportunidade.svg"
color = "#F2A900"
tip = "É o que você deixa de ganhar ao escolher uma opção em vez de outra. Toda escolha tem um custo, mesmo sem sair dinheiro do bolso."
example = "Deixar R$ 20.000 parados na conta em vez de aplicar a 1% ao mês custa R$ 200 por mês de rendimento perdido."

[[concepts]]
id = "risco"
level = 2
name = "Risco"
image = "cartas/engenharia/risco.svg"
color = "#C2410C"
tip = "Risco é a chance de o resultado sair diferente do previsto. Entre dois projetos que rendem o mesmo, o de menor risco costuma ser a melhor escolha."
example = "O projeto A rende R$ 10.000 por ano com certeza. O B pode render R$ 4.000 ou R$ 16.000, meio a meio. Em média os dois dão R$ 10.000, mas o B pode decepcionar."

# --------------------------------------------------------------------------
# Nível 3 — Operações e tomada de decisão

[[concepts]]
id = "ponto_equilibrio"
level = 3
name = "Ponto de equilíbrio"
image = "cartas/engenharia/ponto_equilibrio.svg"
color = "#00798C"
tip = "É a quantidade vendida em que a receita paga todos os custos e o lucro é zero. Acima dele começa o lucro."
example = "Custos fixos de R$ 6.000 por mês, camiseta vendida a R$ 50 e produzida por R$ 20: equilíbrio em 6.000 ÷ (50 − 20) = 200 camisetas."

[[concepts]]
id = "custo_unitario"
level = 3
name = "Custo unitário"
image = "cartas/engenharia/custo_unitario.svg"
color = "#525C82"
tip = "É quanto custa, em média, fazer uma unidade: custo total dividido pela quantidade produzida. Produzir mais divide o custo fixo entre mais peças."
example = "Uma linha tem R$ 12.000 de custo fixo e R$ 8 de material por peça. Com 1.000 peças, cada uma custa 12 + 8 = R$ 20; com 2.000, custa 6 + 8 = R$ 14."

[[concepts]]
id = "produtividade"
level = 3
name = "Produtividade"
image = "cartas/engenharia/produtividade.svg"
color = "#0369A1"
tip = "Produtividade é quanto se produz com cada recurso, como uma hora de trabalho. Produzir mais com o mesmo esforço baixa o custo de cada peça."
example = "Uma equipe faz 480 peças em 8 horas: 60 por hora. Com um molde melhor, faz 640 no mesmo turno, 80 por hora. São 33% a mais."

[[concepts]]
id = "desperdicio"
level = 3
name = "Desperdício"
image = "cartas/engenharia/desperdicio.svg"
color = "#12805C"
tip = "Desperdício é tudo que gasta recurso sem virar produto: energia, material, tempo e retrabalho. Cortar desperdício aumenta o lucro sem vender nada a mais."
example = "Trocar 40 lâmpadas de 100 W por LED de 15 W, acesas 300 horas por mês, economiza 40 × 85 W × 300 h = 1.020 kWh por mês."

[[concepts]]
id = "capacidade"
level = 3
name = "Capacidade produtiva"
image = "cartas/engenharia/capacidade.svg"
color = "#4338CA"
tip = "É o máximo que a fábrica consegue produzir num período. Usar pouco deixa máquinas paradas; passar do limite gera atraso e hora extra."
example = "Uma linha consegue fazer 3.000 peças por mês e está fazendo 2.400: usa 2.400 ÷ 3.000 = 80% da capacidade."

[[concepts]]
id = "pecas_boas"
level = 3
name = "Peças boas"
image = "cartas/engenharia/pecas_boas.svg"
color = "#15803D"
tip = "Nem tudo que sai da máquina pode ser vendido. O rendimento é a parte das peças que sai sem defeito; peça com defeito gasta material e tempo à toa."
example = "De 1.200 garrafas fabricadas, 1.140 saíram perfeitas: rendimento de 1.140 ÷ 1.200 = 95%. As outras 60 vão para o retrabalho."

[[concepts]]
id = "cenarios"
level = 3
name = "Análise de cenários"
image = "cartas/engenharia/cenarios.svg"
color = "#A21CAF"
tip = "Quando o futuro é incerto, calcule o resultado em mais de um cenário (pessimista, provável e otimista) antes de decidir."
example = "Uma melhoria custa R$ 9.000 e pode economizar R$ 1.500, R$ 3.000 ou R$ 4.500 por mês. O payback fica entre 2 e 6 meses: mesmo no pior caso, ela se paga em meio ano."

[[concepts]]
id = "gargalo"
level = 3
name = "Gargalo"
image = "cartas/engenharia/gargalo.svg"
color = "#C27C00"
tip = "Gargalo é a etapa mais lenta do processo: é ela que define quanto a fábrica inteira produz. Acelerar outra etapa não adianta."
example = "O corte faz 120 peças por hora, a costura 80 e a embalagem 150. A linha toda entrega 80 por hora: só acelerar a costura aumenta a produção."
