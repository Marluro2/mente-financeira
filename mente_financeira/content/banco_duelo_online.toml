[[questions]]
id = "F-01"
level = 1
topic = "Dinheiro"
item = "Para que serve?"
question = "Para que serve o dinheiro?"
answer = "Para trocar por coisas e serviços"
wrong = ["Só para guardar na gaveta", "Para colecionar figurinhas", "Para nada, é só papel"]
explanation = "O dinheiro é usado nas trocas: com ele compramos o que precisamos e pagamos por serviços."

[[questions]]
id = "F-02"
level = 1
topic = "Dinheiro"
item = "De onde vem?"
question = "De onde vem o dinheiro que uma família usa no mês?"
answer = "Do trabalho das pessoas"
wrong = ["Da máquina do banco, de graça", "Aparece sozinho na carteira", "Das lojas do bairro"]
explanation = "O dinheiro da família vem, principalmente, do trabalho de quem trabalha na casa."

[[questions]]
id = "F-03"
level = 1
topic = "Dinheiro"
item = "Dinheiro no cartão"
question = "Quando alguém paga com cartão ou Pix, o dinheiro..."
answer = "Sai da conta da pessoa"
wrong = ["Não sai de lugar nenhum", "É pago pela loja", "Volta no dia seguinte"]
explanation = "Cartão e Pix são outros jeitos de pagar. O dinheiro é de verdade e sai da conta de quem pagou."

[[questions]]
id = "F-04"
level = 1
topic = "Necessidade e desejo"
item = "Comida"
question = "Comer todos os dias é uma necessidade ou um desejo?"
answer = "Necessidade"
wrong = ["Desejo", "Nenhum dos dois", "Só um capricho"]
explanation = "Necessidade é o que precisamos para viver bem, como comida, água, casa e saúde."

[[questions]]
id = "F-05"
level = 1
topic = "Necessidade e desejo"
item = "Brinquedo novo"
question = "Um brinquedo novo, quando já temos vários, é..."
answer = "Um desejo"
wrong = ["Uma necessidade", "Uma obrigação", "Um remédio"]
explanation = "Desejo é algo que queremos, mas sem o qual dá para viver. Não é errado ter desejos: é bom pensar antes."

[[questions]]
id = "F-06"
level = 1
topic = "Necessidade e desejo"
item = "O que vem primeiro?"
question = "Com pouco dinheiro, o que devemos pagar primeiro?"
answer = "As necessidades"
wrong = ["Os desejos", "O que estiver na moda", "O que for mais bonito"]
explanation = "Primeiro cuidamos do que é necessário. O que sobrar pode ir para os desejos ou para guardar."

[[questions]]
id = "F-07"
level = 1
topic = "Guardar dinheiro"
item = "Cofrinho"
question = "Para que serve um cofrinho?"
answer = "Para juntar dinheiro aos poucos"
wrong = ["Para gastar mais rápido", "Para esconder dos pais", "Para o dinheiro sumir"]
explanation = "Guardando um pouco de cada vez, juntamos dinheiro para algo que queremos no futuro."

[[questions]]
id = "F-08"
level = 1
topic = "Guardar dinheiro"
item = "Esperar vale a pena"
question = "Quem guarda dinheiro em vez de gastar tudo hoje..."
answer = "Pode comprar algo melhor depois"
wrong = ["Perde todo o dinheiro", "Nunca pode usar o dinheiro", "Fica devendo para alguém"]
explanation = "Esperar um pouco e guardar ajuda a conseguir coisas que custam mais do que temos agora."

[[questions]]
id = "F-09"
level = 1
topic = "Guardar dinheiro"
item = "Objetivo"
question = "O que é ter um objetivo com o dinheiro?"
answer = "Saber para que estou guardando"
wrong = ["Gastar sem pensar", "Pedir dinheiro todo dia", "Comprar tudo o que vejo"]
explanation = "Um objetivo, como uma bicicleta, ajuda a ter paciência e a guardar com vontade."

[[questions]]
id = "F-10"
level = 1
topic = "Guardar dinheiro"
item = "Imprevistos"
question = "Por que é bom ter um dinheiro guardado?"
answer = "Para ajudar em uma emergência"
wrong = ["Para não precisar estudar", "Para gastar tudo de uma vez", "Não é bom guardar"]
explanation = "Um dinheiro guardado ajuda quando acontece algo que não esperávamos, como um conserto."

[[questions]]
id = "F-11"
level = 1
topic = "Planejar os gastos"
item = "Orçamento"
question = "O que é fazer um orçamento?"
answer = "Planejar como usar o dinheiro"
wrong = ["Gastar tudo no primeiro dia", "Pegar dinheiro emprestado", "Esquecer quanto tenho"]
explanation = "Orçamento é um plano: quanto entra, quanto vamos gastar e quanto vamos guardar."

[[questions]]
id = "F-12"
level = 1
topic = "Planejar os gastos"
item = "Três potes"
question = "Na ideia dos três potes, a mesada é dividida em..."
answer = "Guardar, gastar e doar"
wrong = ["Comer, dormir e brincar", "Só gastar", "Esconder, perder e achar"]
explanation = "Separar a mesada em três partes ajuda a guardar, aproveitar e também ajudar os outros."

[[questions]]
id = "F-13"
level = 1
topic = "Planejar os gastos"
item = "Anotar os gastos"
question = "Por que é bom anotar o que gastamos?"
answer = "Para saber para onde vai o dinheiro"
wrong = ["Para gastar mais", "Para o dinheiro aumentar sozinho", "Não serve para nada"]
explanation = "Anotando, descobrimos onde gastamos mais e onde dá para economizar."

[[questions]]
id = "F-14"
level = 1
topic = "Comprar bem"
item = "Preço"
question = "Antes de comprar, o que é bom fazer?"
answer = "Comparar o preço em outras lojas"
wrong = ["Comprar na primeira loja", "Pagar o mais caro sempre", "Não olhar o preço"]
explanation = "O mesmo produto pode ter preços diferentes. Comparar ajuda a economizar."

[[questions]]
id = "F-15"
level = 1
topic = "Comprar bem"
item = "Troco"
question = "O que é o troco?"
answer = "O que volta quando pagamos a mais"
wrong = ["Um presente da loja", "Um desconto especial", "O preço do produto"]
explanation = "Se pagamos com uma nota maior que o preço, a loja devolve a diferença: o troco. É bom conferir!"

[[questions]]
id = "F-16"
level = 1
topic = "Comprar bem"
item = "Propaganda"
question = "Uma propaganda diz: \"Compre já, você precisa!\". O melhor é..."
answer = "Pensar se eu preciso mesmo"
wrong = ["Comprar na hora", "Comprar dois iguais", "Pedir para comprar escondido"]
explanation = "Propagandas querem vender. Pensar antes evita comprar o que não vamos usar."

[[questions]]
id = "F-17"
level = 1
topic = "Trabalho e cuidado"
item = "Trabalho"
question = "Por que as pessoas trabalham?"
answer = "Para ganhar dinheiro e ajudar"
wrong = ["Porque é proibido brincar", "Para gastar o tempo", "Ninguém precisa trabalhar"]
explanation = "Com o trabalho as pessoas ganham dinheiro e também fazem coisas úteis para todos."

[[questions]]
id = "F-18"
level = 1
topic = "Trabalho e cuidado"
item = "Cuidar das coisas"
question = "Cuidar bem do material da escola ajuda a..."
answer = "Economizar, pois dura mais"
wrong = ["Gastar mais dinheiro", "Estragar mais rápido", "Não muda nada"]
explanation = "O que dura mais não precisa ser comprado de novo. Cuidar também é economizar."

[[questions]]
id = "F-19"
level = 1
topic = "Trabalho e cuidado"
item = "Desperdício"
question = "Deixar a luz acesa sem ninguém no quarto é..."
answer = "Desperdício de dinheiro"
wrong = ["Um jeito de economizar", "Bom para a conta de luz", "Obrigatório"]
explanation = "A conta de luz é paga com dinheiro. Apagar a luz ao sair economiza e ajuda o planeta."

[[questions]]
id = "F-20"
level = 1
topic = "Trabalho e cuidado"
item = "Doar"
question = "Doar um brinquedo que não usamos mais é..."
answer = "Um jeito de ajudar outra pessoa"
wrong = ["Jogar dinheiro fora", "Proibido", "Uma compra"]
explanation = "O que não usamos mais pode fazer outra pessoa feliz. Doar também é cuidar."

