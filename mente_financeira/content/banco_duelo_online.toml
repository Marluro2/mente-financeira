[[questions]]
id = "S-01"
level = 3
topic = "Fluxo de caixa e lucro"
item = "Fluxo de caixa"
question = "O que o fluxo de caixa registra?"
answer = "Entradas e saídas de dinheiro"
wrong = ["Só o estoque da fábrica", "O número de funcionários", "Só as vendas a prazo"]
explanation = "O fluxo de caixa mostra quando o dinheiro entra e sai, período a período."

[[questions]]
id = "S-02"
level = 3
topic = "Fluxo de caixa e lucro"
item = "Receita x lucro"
question = "Qual a diferença entre receita e lucro?"
answer = "Lucro é a receita menos os custos"
wrong = ["São a mesma coisa", "Receita é sempre menor", "Lucro não considera custos"]
explanation = "Receita é tudo o que entra com as vendas; lucro é o que sobra depois de pagar os custos."

[[questions]]
id = "S-03"
level = 3
topic = "Fluxo de caixa e lucro"
item = "Lucro sem caixa"
question = "Uma empresa pode ter lucro e faltar dinheiro no caixa?"
answer = "Sim, se as vendas são a prazo"
wrong = ["Não, lucro é dinheiro no caixa", "Só se não tiver custos", "Nunca acontece"]
explanation = "Lucro é contábil; caixa é o dinheiro disponível. Vender a prazo dá lucro, mas o dinheiro só entra depois."

[[questions]]
id = "S-04"
level = 3
topic = "Custos"
item = "Custo fixo"
question = "O aluguel do galpão, que não muda com a produção, é um custo..."
answer = "Fixo"
wrong = ["Variável", "De oportunidade", "Unitário"]
explanation = "Custo fixo não depende da quantidade produzida no mês, como aluguel e salários administrativos."

[[questions]]
id = "S-05"
level = 3
topic = "Custos"
item = "Custo variável"
question = "A matéria-prima de cada peça é um custo..."
answer = "Variável"
wrong = ["Fixo", "Afundado", "Indireto fixo"]
explanation = "Custo variável cresce junto com a produção: quanto mais peças, mais matéria-prima."

[[questions]]
id = "S-06"
level = 3
topic = "Custos"
item = "Depreciação"
question = "O que é depreciação?"
answer = "Perda de valor de um bem com o uso"
wrong = ["Aumento do preço da máquina", "Um tipo de imposto", "O lucro de um equipamento"]
explanation = "Máquinas e equipamentos se desgastam e ficam obsoletos; a depreciação registra essa perda."

[[questions]]
id = "S-07"
level = 3
topic = "Custos"
item = "Margem de contribuição"
question = "A margem de contribuição é..."
answer = "Preço menos o custo variável"
wrong = ["Preço menos o aluguel", "O lucro total do ano", "O custo fixo por peça"]
explanation = "É o quanto cada unidade vendida sobra para pagar os custos fixos e gerar lucro."

[[questions]]
id = "S-08"
level = 3
topic = "Avaliação de investimentos"
item = "VPL"
question = "Um projeto com VPL positivo indica que..."
answer = "Gera valor acima da TMA"
wrong = ["Vai dar prejuízo", "Rende igual à poupança", "Não tem custos"]
explanation = "VPL > 0: trazidos a valor presente, os ganhos superam o investimento e o retorno mínimo exigido."

[[questions]]
id = "S-09"
level = 3
topic = "Avaliação de investimentos"
item = "TIR"
question = "A TIR de um projeto é a taxa que..."
answer = "Torna o VPL igual a zero"
wrong = ["Dobra o investimento", "O banco cobra no empréstimo", "Mede a inflação"]
explanation = "A TIR é o retorno do próprio projeto. Se for maior que a TMA, o projeto é atrativo."

[[questions]]
id = "S-10"
level = 3
topic = "Avaliação de investimentos"
item = "Payback"
question = "O que o payback mede?"
answer = "Tempo para recuperar o investido"
wrong = ["O lucro total do projeto", "A taxa de juros do banco", "O custo fixo mensal"]
explanation = "Payback é quanto tempo leva para as entradas de caixa pagarem o que foi investido."

[[questions]]
id = "S-11"
level = 3
topic = "Avaliação de investimentos"
item = "TMA"
question = "A TMA (taxa mínima de atratividade) é..."
answer = "O retorno mínimo que se aceita"
wrong = ["A taxa máxima de juros", "O lucro garantido", "O imposto do projeto"]
explanation = "É a régua da decisão: um projeto só vale a pena se render mais que a TMA."

[[questions]]
id = "S-12"
level = 3
topic = "Dinheiro no tempo"
