# Banco de questões — Duelo online da feira (só conceitos, sem contas)
#
# O Duelo online (Duelo em sala, servidor_sala.py) tem três níveis:
#   1 = Ensino Fundamental, 2 = Ensino Médio, 3 = Ensino Superior.
# A cada par formado sai uma questão do nível da sala, sem repetir até acabarem.
# São perguntas simples, de ideia, para demonstrar o jogo: nenhuma pede cálculo.
#
# Mesmo formato do banco_engenharia.toml:
# - `answer` é a alternativa certa e `wrong` as três erradas (o jogo embaralha);
# - `explanation` aparece depois da resposta (\n quebra a linha);
# - `item` é o título curto mostrado acima da pergunta.
# As alternativas são curtas para caber nos botões do jogo (até ~35 letras).
# Depois de editar, rode `python -m pytest`.

