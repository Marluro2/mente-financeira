[[questions]]
id = "M-01"
level = 2
topic = "Poupança e reserva"
item = "Guarda-chuva financeiro"
question = "O que é uma reserva de emergência?"
answer = "Dinheiro guardado para imprevistos"
wrong = ["Dinheiro para viajar nas férias", "Um tipo de empréstimo", "O limite do cartão"]
explanation = "A reserva cobre gastos inesperados, como perder o emprego ou uma doença, sem precisar se endividar."

[[questions]]
id = "M-02"
level = 2
topic = "Poupança e reserva"
item = "Onde guardar a reserva"
question = "A reserva de emergência deve ficar em um lugar..."
answer = "Seguro e fácil de sacar"
wrong = ["Arriscado, para render muito", "Que só libera daqui a anos", "Na mão de um amigo"]
explanation = "Na emergência o dinheiro precisa estar disponível rápido e sem risco de perder valor."

[[questions]]
id = "M-03"
level = 2
topic = "Poupança e reserva"
item = "Pagar-se primeiro"
question = "\"Pagar-se primeiro\" significa..."
answer = "Guardar assim que recebe"
wrong = ["Gastar tudo e guardar o resto", "Comprar algo para si todo mês", "Pagar as dívidas dos outros"]
explanation = "Separar a parte da poupança logo que o dinheiro entra evita que ela seja gasta sem perceber."

[[questions]]
id = "M-04"
level = 2
topic = "Juros e inflação"
item = "Juros"
question = "O que são juros?"
answer = "O preço de usar dinheiro no tempo"
wrong = ["Um imposto sobre compras", "Um desconto à vista", "O salário do mês"]
explanation = "Quem pega emprestado paga juros; quem empresta ou investe recebe juros."

[[questions]]
id = "M-05"
level = 2
topic = "Juros e inflação"
item = "Juros compostos"
question = "Nos juros compostos, os juros são calculados sobre..."
answer = "O valor inicial mais os juros"
wrong = ["Só o valor inicial", "Só o primeiro mês", "Nada, não existem juros"]
explanation = "São os \"juros sobre juros\": o valor cresce cada vez mais rápido, a favor de quem investe e contra quem deve."

[[questions]]
id = "M-06"
level = 2
topic = "Juros e inflação"
item = "Inflação"
question = "O que é inflação?"
answer = "Alta geral dos preços"
wrong = ["Queda de todos os preços", "Aumento do salário", "Um tipo de investimento"]
explanation = "Com inflação, o mesmo dinheiro compra menos coisas com o passar do tempo."

[[questions]]
id = "M-07"
level = 2
topic = "Juros e inflação"
item = "Poder de compra"
question = "Dinheiro parado em casa, com inflação, faz o quê?"
answer = "Perde poder de compra"
wrong = ["Ganha valor sozinho", "Fica sempre igual", "Rende juros"]
explanation = "A nota continua com o mesmo número, mas compra menos. Por isso vale investir o que está guardado."

[[questions]]
id = "M-08"
level = 2
topic = "Crédito e dívida"
item = "Cartão de crédito"
question = "Pagar só o mínimo da fatura do cartão..."
answer = "Gera juros muito altos"
wrong = ["Quita toda a dívida", "Dá desconto na fatura", "Não tem consequência"]
explanation = "O restante vai para o rotativo, um dos juros mais caros do mercado. A dívida cresce rápido."

[[questions]]
id = "M-09"
level = 2
topic = "Crédito e dívida"
item = "Limite do cartão"
question = "O limite do cartão de crédito é..."
answer = "Um empréstimo que precisa pagar"
wrong = ["Dinheiro extra de presente", "Parte do salário", "Um investimento"]
explanation = "Tudo o que se compra no cartão vira uma conta a pagar na fatura. Limite não é renda."

[[questions]]
id = "M-10"
level = 2
topic = "Crédito e dívida"
item = "Endividamento"
question = "Quando é mais perigoso fazer uma dívida?"
answer = "Para pagar outra dívida ou supérfluo"
wrong = ["Nunca é perigoso", "Quando tem dinheiro guardado", "Quando os juros são zero"]
explanation = "Pegar crédito para pagar outra dívida ou para desejos pode virar uma bola de neve."

[[questions]]
id = "M-11"
level = 2
topic = "Crédito e dívida"
item = "Parcelar"
question = "Antes de parcelar uma compra, é importante ver..."
answer = "Se cabe no orçamento dos meses"
wrong = ["Só o valor da primeira parcela", "A cor da embalagem", "Se o vendedor é simpático"]
explanation = "As parcelas somam nos próximos meses. Muitas parcelas juntas apertam o orçamento."

[[questions]]
id = "M-12"
level = 2
topic = "Investimento"
item = "Investir"
question = "Investir é..."
answer = "Aplicar dinheiro para ele crescer"
wrong = ["Gastar com o que gosta", "Pegar dinheiro emprestado", "Guardar debaixo do colchão"]
explanation = "No investimento o dinheiro trabalha para você e rende ao longo do tempo."

[[questions]]
id = "M-13"
level = 2
topic = "Investimento"
item = "Risco e retorno"
question = "Em geral, um investimento que promete render mais..."
answer = "Tem mais risco"
wrong = ["Não tem risco nenhum", "É sempre garantido", "Rende menos que a poupança"]
explanation = "Retorno maior costuma vir com risco maior. Promessa de ganho alto e sem risco é sinal de golpe."

[[questions]]
id = "M-14"
level = 2
topic = "Investimento"
item = "Diversificar"
question = "Diversificar os investimentos significa..."
answer = "Não colocar tudo num lugar só"
wrong = ["Investir só em uma empresa", "Trocar de banco todo mês", "Sacar tudo de uma vez"]
explanation = "Espalhar o dinheiro em opções diferentes diminui o estrago se uma delas for mal."

[[questions]]
id = "M-15"
level = 2
topic = "Investimento"
item = "Começar cedo"
question = "Por que começar a investir cedo é vantajoso?"
answer = "Os juros compostos têm mais tempo"
wrong = ["Porque depois é proibido", "Porque jovem não paga imposto", "Não faz diferença"]
explanation = "Quanto mais tempo o dinheiro fica aplicado, mais os juros sobre juros fazem efeito."

[[questions]]
id = "M-16"
level = 2
topic = "Orçamento e consumo"
item = "Renda e despesa"
question = "Um orçamento equilibrado é quando..."
answer = "Gasto menos do que ganho"
wrong = ["Gasto mais do que ganho", "Uso todo o limite do cartão", "Não anoto nada"]
explanation = "Gastar menos do que se ganha sobra dinheiro para guardar e investir."

[[questions]]
id = "M-17"
level = 2
topic = "Orçamento e consumo"
item = "Consumo consciente"
question = "O que é consumo consciente?"
answer = "Comprar pensando na real necessidade"
wrong = ["Comprar tudo em promoção", "Nunca comprar nada", "Comprar só o mais caro"]
explanation = "É pensar se precisa, se cabe no bolso e qual o impacto da compra antes de comprar."

[[questions]]
id = "M-18"
level = 2
topic = "Orçamento e consumo"
item = "Compra por impulso"
question = "Uma boa forma de evitar compra por impulso é..."
answer = "Esperar um dia antes de decidir"
wrong = ["Comprar antes que acabe", "Salvar o cartão no celular", "Seguir só a propaganda"]
explanation = "Dar um tempo ajuda a perceber se é desejo do momento ou algo que vale a pena."

[[questions]]
id = "M-19"
level = 2
topic = "Segurança digital"
item = "Golpe do Pix"
question = "Alguém pede um Pix urgente dizendo ser um parente. O certo é..."
answer = "Confirmar ligando para a pessoa"
wrong = ["Fazer o Pix na hora", "Mandar a senha do banco", "Pedir o dobro para conferir"]
explanation = "Golpistas usam a pressa e o nome de conhecidos. Confirme por outro meio antes de pagar."

[[questions]]
id = "M-20"
level = 2
topic = "Segurança digital"
item = "Senha"
question = "A senha do banco deve ser..."
answer = "Secreta, sem passar a ninguém"
wrong = ["Dita para o atendente por telefone", "A data de aniversário", "Anotada no cartão"]
explanation = "Banco nenhum pede sua senha. Senha forte e secreta protege o seu dinheiro."

