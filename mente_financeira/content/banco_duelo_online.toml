question = "Por que um real hoje vale mais que um real daqui a um ano?"
answer = "Hoje o dinheiro pode render juros"
wrong = ["Porque a nota estraga", "Não valem mais, é igual", "Porque o banco cobra tarifa"]
explanation = "O dinheiro de hoje pode ser investido; além disso, a inflação reduz o poder de compra do futuro."

[[questions]]
