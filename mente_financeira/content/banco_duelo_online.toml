answer = "Descontá-lo por uma taxa de juros"
wrong = ["Somar a inflação", "Multiplicar pelo prazo", "Ignorar o tempo"]
explanation = "Descontar permite comparar, na mesma data, dinheiro que entra em momentos diferentes."

